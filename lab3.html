<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаборатори 03 - CSS Загварчлал</title>
    <!-- Google Fonts холбох -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- External CSS холбох -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1 class="main-title">Хэрэглэгчийн бүртгэл</h1>
        <p class="subtitle">Лаборатори 03: CSS3 загварчлал</p>
    </header>

    <main class="site-main">
        <div class="form-container">
            <!-- Position relative/absolute ашигласан Badge жишээ -->
            <div class="form-badge">Шинэ</div>
            
            <h2 class="form-title">Бүртгэлийн анкет</h2>
            
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="fullname" class="form-label">Овог, нэр:</label>
                    <input type="text" id="fullname" name="fullname" class="form-input" required pattern="[A-Za-zА-Яа-яЁё\s]+" title="Зөвхөн үсэг оруулна уу">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Имэйл хаяг:</label>
                    <input type="email" id="email" name="email" class="form-input" required placeholder="example@mail.com">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Нууц үг:</label>
                    <input type="password" id="password" name="password" class="form-input" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="birthdate" class="form-label">Төрсөн огноо:</label>
                    <input type="date" id="birthdate" name="birthdate" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="profilepic" class="form-label">Профайл зураг:</label>
                    <input type="file" id="profilepic" name="profilepic" class="form-input">
                </div>

                <div class="form-group">
                    <label for="city" class="form-label">Аймаг / Хот:</label>
                    <select id="city" name="city" class="form-select" required>
                        <option value="">-- Сонгоно уу --</option>
                        <option value="ub">Улаанбаатар</option>
                        <option value="darhan">Дархан-Уул</option>
                        <option value="erdenet">Орхон</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Хүйс:</label>
                    <div class="radio-group">
                        <input type="radio" id="female" name="gender" value="female" required>
                        <label for="female">Эмэгтэй</label>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Эрэгтэй</label>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Бусад</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Мэдэгдэл хүлээн авах сувгууд:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="notif-email" name="notifications" value="email">
                        <label for="notif-email">И-мэйл</label>
                        <input type="checkbox" id="notif-sms" name="notifications" value="sms">
                        <label for="notif-sms">SMS</label>
                        <input type="checkbox" id="notif-app" name="notifications" value="app">
                        <label for="notif-app">Апп мэдэгдэл</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bio" class="form-label">Өөрийн тухай товч танилцуулга:</label>
                    <textarea id="bio" name="bio" class="form-input" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Бүртгүүлэх</button>
                </div>

            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Бүх эрх хуулиар хамгаалагдсан.</p>
    </footer>

</body>
</html>
